<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>World Cup 2026 Prediction Assistant · Precise Score Forecasts</title>
<meta name="description" content="Free World Cup 2026 prediction tool. Precise scoreline forecasts from bookmaker odds using a Poisson model — for every match, in 10 languages." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f5f1;--card:#ffffff;--ink:#1a1916;--ink-soft:#3c3a35;--muted:#8a857b;
    --line:#e6e3db;--line-strong:#d8d4ca;--accent:#9a2a1f;--home:#15694e;--draw:#c3bdb0;--away:#a23b2e;
    --serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:1160px;margin:0 auto;padding:0 24px}
  ::selection{background:#e9e3d3}
  [dir="rtl"] body{font-family:"Inter","Segoe UI",Tahoma,sans-serif}

  /* Ticker */
  .ticker{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:9px 24px}
  .live-pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.25}}
  .ticker-track{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
  .ticker-move{display:inline-block;padding-left:100%;animation:scroll 50s linear infinite}
  .ticker:hover .ticker-move{animation-play-state:paused}
  @keyframes scroll{to{transform:translateX(-100%)}}
  .ticker-item{display:inline-flex;align-items:baseline;gap:8px;margin:0 28px;font-size:13.5px;color:var(--ink-soft)}
  .ticker-item .tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .ticker-item b{color:var(--ink);font-weight:600}

  /* Masthead */
  .util{display:flex;align-items:center;justify-content:space-between;padding-top:22px}
  .brand{font-weight:700;font-size:13px;letter-spacing:.02em;color:var(--ink)}
  .langsel{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);background:var(--card);
    border:1px solid var(--line-strong);border-radius:5px;padding:8px 12px;cursor:pointer;outline:none}
  .langsel:focus{border-color:var(--ink)}
  header.masthead{padding:8px 0 26px;border-bottom:2px solid var(--ink)}
  .kicker{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-top:20px}
  .masthead h1{font-family:var(--serif);font-weight:600;font-size:clamp(38px,7vw,74px);line-height:.98;letter-spacing:-.02em;margin:14px 0 0}
  .masthead .lede{margin:16px 0 0;max-width:620px;font-size:16px;color:var(--ink-soft)}
  .masthead .lede b{font-weight:600;color:var(--ink)}
  .strip{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;background:var(--card);margin-top:26px;overflow:hidden}
  .strip .cell{flex:1;min-width:140px;padding:16px 20px;border-right:1px solid var(--line)}
  .strip .cell:last-child{border-right:none}
  .strip .n{font-family:var(--serif);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
  .strip .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:7px}

  /* Search + controls */
  .searchbar{position:relative;margin:30px 0 0}
  .searchbar svg{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .searchbar input{width:100%;font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--card);
    border:1px solid var(--line-strong);border-radius:5px;padding:14px 44px;transition:.15s;outline:none}
  .searchbar input::placeholder{color:var(--muted)}
  .searchbar input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(26,25,22,.06)}
  .searchbar .clear{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);cursor:pointer;border:none;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:4px;display:none}
  .searchbar .clear.show{display:block}
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:14px 0 6px}
  .btn{cursor:pointer;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:4px;font-weight:600;font-size:13.5px;font-family:var(--sans);transition:.15s}
  .btn:hover{border-color:var(--ink)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .seg{display:flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden}
  .seg button{cursor:pointer;border:none;background:var(--card);color:var(--muted);padding:9px 15px;font-weight:600;font-size:13px;font-family:var(--sans);border-inline-end:1px solid var(--line);transition:.15s}
  .seg button:last-child{border-inline-end:none}
  .seg button.active{background:var(--ink);color:#fff}
  .auto-wrap{margin-inline-start:auto;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:500}
  .switch{position:relative;width:42px;height:24px;background:#ddd9cf;border-radius:999px;cursor:pointer;transition:.2s;flex:0 0 auto}
  .switch.on{background:var(--home)}
  .switch i{position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch.on i{inset-inline-start:21px}
  .feed{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted)}
  .feed .fd{width:8px;height:8px;border-radius:50%;background:#c9a23a}
  .feed.live .fd{background:var(--home)}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:18px 0 8px}
  .md-head{grid-column:1/-1;background:var(--paper);padding:22px 4px 10px;display:flex;align-items:baseline;gap:12px}
  .md-head .t{font-family:var(--serif);font-size:20px;font-weight:600}
  .md-head .r{flex:1;height:1px;background:var(--line-strong)}
  .card{background:var(--card);padding:18px 18px 14px;position:relative;transition:background .15s;--tc:var(--ink)}
  .card:hover{background:#fffdf9}
  .card .toprule{position:absolute;top:0;inset-inline-start:0;width:36px;height:3px;background:var(--tc)}
  .m-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-bottom:16px}
  .m-top .grp{font-weight:600;letter-spacing:.04em;color:var(--ink-soft)}
  .m-top time{font-variant-numeric:tabular-nums}
  .livebox{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:11px;font-variant-numeric:tabular-nums;
    padding:2px 8px;border-radius:4px;letter-spacing:.03em}
  .livebox.on{background:var(--accent);color:#fff}
  .livebox.fin{background:var(--ink);color:#fff}
  .livebox .ld{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
  .fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:18px}
  .side{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
  .side .tname{font-weight:600;font-size:14px;letter-spacing:-.01em}
  img.flag{width:42px;height:28px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.18);display:block}
  img.flag.sm{width:22px;height:15px;border-radius:2px}
  .flag-x{display:inline-block;width:42px;height:28px;border-radius:3px;background:repeating-linear-gradient(45deg,#e6e3db,#e6e3db 5px,#efece4 5px,#efece4 10px);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .flag-x.sm,.fav-row .flag-x,.pick .flag-x{width:22px;height:15px}
  .predict{text-align:center}
  .predict .pl{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
  .pscore{font-family:var(--serif);font-weight:600;font-size:30px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:baseline;gap:3px;line-height:1}
  .pscore i{color:var(--muted);font-style:normal;font-size:22px}
  .obar{height:6px;border-radius:3px;overflow:hidden;display:flex;background:#efece4;margin-bottom:10px}
  .obar i{height:100%;transition:width .85s cubic-bezier(.22,1,.36,1)}
  .obar .b-home{background:var(--home)}.obar .b-draw{background:var(--draw)}.obar .b-away{background:var(--away)}
  .onums{display:flex;justify-content:space-between}
  .onums>span{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
  .onums .val{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
  .onums small{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .onums .h .val{color:var(--home)}.onums .d .val{color:#8c8576}.onums .a .val{color:var(--away)}
  .m-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
  .conf{display:flex;align-items:center;gap:6px}
  .conf .dots{display:flex;gap:3px}
  .conf .dot{width:6px;height:6px;border-radius:50%;background:var(--line-strong)}
  .conf .dot.on{background:var(--ink-soft)}
  .noresult{grid-column:1/-1;background:var(--card);padding:40px 24px;text-align:center;color:var(--muted);font-size:14px}

  /* Sections */
  section.block{margin:40px 0}
  .sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
  .sec-head h2{font-family:var(--serif);font-size:24px;font-weight:600;margin:0}
  .sec-head .r{flex:1;height:1px;background:var(--line-strong)}
  .sec-head .meta{font-size:12px;color:var(--muted)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:24px}
  .vintro{margin:0 0 16px;font-size:14px;color:var(--ink-soft);max-width:760px}
  .vintro b{color:var(--ink);font-weight:600}
  .bankroll-row{display:flex;align-items:center;gap:8px;margin-bottom:18px;font-size:14px;font-weight:600}
  .bankroll-row .cur{color:var(--muted)}
  .bankroll-row input{width:90px;font-family:var(--sans);font-size:14px;font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line-strong);border-radius:4px;padding:7px 10px;outline:none;font-variant-numeric:tabular-nums}
  .bankroll-row input:focus{border-color:var(--ink)}
  .vscroll{overflow-x:auto}
  table.vtab{width:100%;border-collapse:collapse;font-size:13.5px}
  table.vtab th{text-align:start;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 12px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
  table.vtab td{padding:12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
  table.vtab td.vm{display:flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
  table.vtab tr:last-child td{border-bottom:none}
  table.vtab .edgec{color:var(--home);font-weight:700}
  .vwarn{margin:16px 0 0;font-size:11.5px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:14px}
  .pkpis{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:18px}
  .pk{flex:1;min-width:96px;background:var(--card);padding:13px 16px}
  .pk .pn{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .pk .pv{font-family:var(--serif);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
  .pos{color:var(--home)}.neg{color:var(--away)}
  .pstat{font-weight:700;font-variant-numeric:tabular-nums}
  .pstat.won{color:var(--home)}.pstat.lost{color:var(--away)}.pstat.open{color:var(--muted)}
  .clv-input{width:78px;font-family:var(--sans);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--card);border:1px solid var(--line-strong);border-radius:4px;padding:5px 7px;outline:none}
  .clv-input:focus{border-color:var(--ink)}
  .strat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .strat{background:var(--card);padding:18px;border-top:3px solid var(--ink)}
  .strat.safe{border-top-color:var(--home)}.strat.normal{border-top-color:var(--ink)}.strat.risk{border-top-color:#c8861d}
  .strat-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .sname{font-family:var(--serif);font-size:19px;font-weight:600}
  .sf{font-size:11px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  .sdesc{font-size:12px;color:var(--muted);margin:0 0 14px;min-height:50px;line-height:1.5}
  .srow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .srow:last-child{border-bottom:none}
  .srow span{color:var(--muted)}
  .srow b{font-variant-numeric:tabular-nums;font-weight:700}
  .srow.big{padding:9px 0}.srow.big b{font-size:18px}
  .sdist{margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--line-strong)}
  .srow.sd{padding:5px 0;border-bottom:none;font-size:12.5px}
  .srow.sd span{color:var(--ink-soft)}
  .srow.sd em{color:var(--muted);font-style:normal;font-size:11px}
  .srow.sd b{color:var(--ink)}
  .how{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .how .step{background:var(--card);padding:22px}
  .how .num{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--accent);line-height:1}
  .how p{margin:10px 0 0;font-size:14px;color:var(--ink-soft)}
  .how p b{color:var(--ink);font-weight:600}
  .fav-row{display:grid;grid-template-columns:160px 1fr 52px;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
  .fav-row:last-child{border-bottom:none}
  .fav-row .ft{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px}
  .fav-bar{height:8px;border-radius:2px;background:#efece4;overflow:hidden}
  .fav-bar i{display:block;height:100%;background:var(--ink);width:0;transition:width 1s cubic-bezier(.22,1,.36,1)}
  .fav-row .fv{text-align:end;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
  .picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .pick{background:var(--card);padding:14px 16px}
  .pick .q{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
  .pick .a{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
  footer{border-top:2px solid var(--ink);margin-top:50px;padding:28px 0 60px;color:var(--muted);font-size:12.5px;line-height:1.65}
  .note{background:#fbf6ea;border:1px solid #ecdfc2;border-radius:6px;padding:14px 18px;color:#6b5d3c}
  footer p{margin:14px 0 0}
</style>
</head>
<body>

<div class="ticker">
  <span class="live-pill"><span class="live-dot"></span> <span data-i18n="live">Live</span></span>
  <div class="ticker-track"><div class="ticker-move" id="ticker"></div></div>
</div>

<div class="wrap">
  <div class="util">
    <span class="brand">⚽ WC 2026</span>
    <select class="langsel" id="lang" aria-label="Language"></select>
  </div>

  <header class="masthead">
    <div class="kicker" data-i18n="kicker"></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="strip">
      <div class="cell"><div class="n" id="kpi-matches">0</div><div class="l" data-i18n="kpiMatches"></div></div>
      <div class="cell"><div class="n" id="kpi-conf">0%</div><div class="l" data-i18n="kpiConf"></div></div>
      <div class="cell"><div class="n">48</div><div class="l" data-i18n="kpiTeams"></div></div>
      <div class="cell"><div class="n" id="kpi-updated">–</div><div class="l" data-i18n="kpiUpdated"></div></div>
    </div>
  </header>

  <div class="searchbar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" type="text" data-i18n-ph="searchPh" autocomplete="off" />
    <button class="clear" id="searchClear" aria-label="Clear">×</button>
  </div>

  <div class="controls">
    <div class="seg" id="filter">
      <button class="active" data-f="all" data-i18n="fAll"></button>
      <button data-f="0" data-i18n="fMd1"></button>
      <button data-f="1" data-i18n="fMd2"></button>
      <button data-f="2" data-i18n="fMd3"></button>
    </div>
    <button class="btn primary" id="recalc" data-i18n="recalc"></button>
    <div class="auto-wrap">
      <span class="feed" id="feedStatus"><span class="fd"></span><span class="ft"></span></span>
      <span data-i18n="autoRefresh"></span>
      <div class="switch on" id="autoSwitch"><i></i></div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <section class="block">
    <div class="sec-head"><h2 data-i18n="valueTitle"></h2><span class="r"></span><span class="meta" data-i18n="valueMeta"></span></div>
    <div class="panel">
      <p class="vintro" data-i18n="valueIntro"></p>
      <div class="bankroll-row"><label for="bankroll" data-i18n="bankroll"></label><span class="cur">€</span><input id="bankroll" type="number" value="100" min="10" step="10"></div>
      <div id="valueBox"></div>
    </div>
  </section>

  <section class="block">
    <div class="sec-head"><h2 data-i18n="stratTitle"></h2><span class="r"></span><span class="meta" data-i18n="stratMeta"></span></div>
    <div class="panel">
      <p class="vintro" data-i18n="stratIntro"></p>
      <div class="bankroll-row"><label for="stakeBudget" data-i18n="totalStake"></label><span class="cur">€</span><input id="stakeBudget" type="number" value="100" min="1" step="10"></div>
      <div id="stratBox"></div>
    </div>
  </section>

  <section class="block">
    <div class="sec-head"><h2 data-i18n="paperTitle"></h2><span class="r"></span><span class="meta" data-i18n="paperMeta"></span></div>
    <div class="panel">
      <p class="vintro" data-i18n="paperIntro"></p>
      <div class="pkpis" id="paperKpis"></div>
      <div id="paperBox"></div>
    </div>
  </section>

  <section class="block">
    <div class="sec-head"><h2 data-i18n="howTitle"></h2><span class="r"></span></div>
    <div class="how">
      <div class="step"><div class="num">1</div><p data-i18n="how1"></p></div>
      <div class="step"><div class="num">2</div><p data-i18n="how2"></p></div>
      <div class="step"><div class="num">3</div><p data-i18n="how3"></p></div>
    </div>
  </section>

  <section class="block">
    <div class="sec-head"><h2 data-i18n="favTitle"></h2><span class="r"></span><span class="meta" data-i18n="favMeta"></span></div>
    <div class="panel" id="favs"></div>
  </section>

  <section class="block">
    <div class="sec-head"><h2 data-i18n="picksTitle"></h2><span class="r"></span><span class="meta" data-i18n="picksMeta"></span></div>
    <div class="picks" id="picks"></div>
  </section>
</div>

<footer>
  <div class="wrap">
    <div class="note"><span data-i18n="footNote"></span> <span data-i18n="disclaimer"></span></div>
    <p data-i18n="footModel"></p>
    <p style="margin-top:10px">Scientific basis: Kelly (1956) · Maher (1982) · Dixon–Coles (1997) · Constantinou &amp; Fenton (2013) · Miller &amp; Davidow (2019) · Buchdahl — full methodology &amp; references in <a href="METHODOLOGY.md" style="color:var(--accent);text-decoration:underline">METHODOLOGY.md</a>.</p>
  </div>
</footer>

<script>
/* ============ i18n ============ */

/* ===== INDEPENDENT MODEL: Elo ratings (eloratings.net scale, Jun 2026) =====
   Source: World Football Elo Ratings. NOT derived from betting odds → real edge candidate. */
const ELO={"Spain":2165,"Argentina":2113,"France":2081,"England":2020,"Brazil":1988,"Portugal":1984,"Colombia":1977,"Netherlands":1961,"Ecuador":1935,"Croatia":1930,"Germany":1925,"Norway":1917,"Turkey":1906,"Japan":1906,"Switzerland":1894,"Uruguay":1892,"Mexico":1868,"Belgium":1866,"Senegal":1866,"Paraguay":1833,"Austria":1830,"Morocco":1822,"Canada":1793,"Australia":1775,"Scotland":1770,"South Korea":1756,"Iran":1764,"Algeria":1743,"USA":1733,"Czechia":1733,"Panama":1733,"Uzbekistan":1718,"Sweden":1714,"Egypt":1699,"Jordan":1685,"Ivory Coast":1676,"DR Congo":1655,"Tunisia":1633,"Iraq":1608,"Bosnia-Herz.":1591,"New Zealand":1585,"Cape Verde":1576,"Saudi Arabia":1566,"Haiti":1532,"South Africa":1517,"Ghana":1503,"Curaçao":1433,"Qatar":1423};
const HOSTS=new Set(["Mexico","USA","Canada"]);
const HFA=65, SUPREMACY_DIV=250, BASE_TOTAL=2.65; // softened goal calibration
const BLEND_W=0.30;      // weight on our model vs the (efficient) market — conservative, pending backtest
const EDGE_MIN=0.04;     // only flag value when our estimate beats the market by >=4 pts
const MIN_PROB=0.20;     // skip unreliable long shots: never bet a team our model gives <20% to win
function modelProbs(home,away){
 const dr=(ELO[home]??1600)-(ELO[away]??1600)+(HOSTS.has(home)?HFA:0);
 const sup=dr/SUPREMACY_DIV;
 const lh=Math.max(0.15,(BASE_TOTAL+sup)/2), la=Math.max(0.15,(BASE_TOTAL-sup)/2);
 let H=0,D=0,A=0;
 for(let i=0;i<=8;i++){const pi=poisson(i,lh);for(let j=0;j<=8;j++){const p=pi*poisson(j,la);if(i>j)H+=p;else if(i===j)D+=p;else A+=p;}}
 const s=H+D+A;return{pH:H/s,pD:D/s,pA:A/s,ts:topScore(lh,la)};
}
let BANKROLL=100;
/* Blend the raw Elo model toward the de-margined market (shrinkage),
   because the market is a strong, efficient prior. Our final estimate is
   only a gentle adjustment of the market — that's what value betting really is. */
function blendedProbs(home,away,mk){
 const m=modelProbs(home,away);
 let bH=BLEND_W*m.pH+(1-BLEND_W)*mk[0],bD=BLEND_W*m.pD+(1-BLEND_W)*mk[1],bA=BLEND_W*m.pA+(1-BLEND_W)*mk[2];
 const s=bH+bD+bA;return[bH/s,bD/s,bA/s];
}
function valueBets(){const rows=[];
 MATCHDAYS.forEach(md=>md.games.forEach(g=>{
  const[home,away,grp,date,oH,oD,oA]=g;const mk=impliedProbs(oH,oD,oA);const b=blendedProbs(home,away,mk);
  const outs=[{side:"home",lbl:home,p:b[0],pm:mk[0],odd:oH},{side:"draw",lbl:t('draw'),p:b[1],pm:mk[1],odd:oD},{side:"away",lbl:away,p:b[2],pm:mk[2],odd:oA}];
  outs.forEach(o=>{o.ev=o.p*o.odd-1;o.edge=o.p-o.pm;o.kelly=(o.p*o.odd-1)/(o.odd-1);});
  const best=outs.filter(o=>o.ev>0&&o.edge>=EDGE_MIN&&o.p>=MIN_PROB).sort((a,b)=>b.ev-a.ev)[0];
  if(best)rows.push({home,away,...best});}));
 return rows.sort((a,b)=>b.edge-a.edge);
}
function renderValue(){const box=document.getElementById("valueBox");const rows=valueBets();

  rows.map(r=>{const stake=BANKROLL*0.25*Math.max(0,r.kelly);
   return `<tr><td class="vm">${flag(r.home,1)} ${r.home} – ${r.away} ${flag(r.away,1)}</td><td><b>${r.lbl}</b></td><td>${r.odd.toFixed(2)}</td><td>${(r.p*100).toFixed(0)}%</td><td>${(r.pm*100).toFixed(0)}%</td><td class="edgec">+${(r.edge*100).toFixed(1)}%</td><td><b>€${stake.toFixed(2)}</b></td></tr>`;}).join("")+
  `</tbody></table></div><p class="vwarn">${t('valueWarn')}</p>`;

/* ===== STRATEGY COMPARISON: enter a total stake, distributed dynamically across value bets ===== */
let STAKE_BUDGET=100;
function renderStrategies(){
 const box=document.getElementById("stratBox");const V=valueBets();const B=STAKE_BUDGET;
 if(!V.length){box.innerHTML=`<div class="noresult">${t('noValue')}</div>`;return;}
 // weighting per risk level: safe favours high win-prob, risk favours high odds (upside)
 const tiers=[{k:"safe",name:t('tierSafe'),desc:t('tierSafeD'),w:b=>b.p*b.p},
              {k:"normal",name:t('tierNormal'),desc:t('tierNormalD'),w:b=>Math.max(1e-4,b.kelly)},
              {k:"risk",name:t('tierRisk'),desc:t('tierRiskD'),w:b=>b.p*(b.odd-1)}];
 box.innerHTML=`<div class="strat-grid">`+tiers.map(ti=>{
   const ws=V.map(ti.w),sw=ws.reduce((a,b)=>a+b,0)||1,stakes=ws.map(w=>B*w/sw);
   let maxP=0,expP=0,allW=1;
   V.forEach((b,i)=>{maxP+=stakes[i]*(b.odd-1);expP+=stakes[i]*(b.p*b.odd-1);allW*=b.p;});
   const roi=B>0?expP/B*100:0;
   const dist=V.map((b,i)=>`<div class="srow sd"><span>${b.lbl} <em>@${b.odd.toFixed(2)}</em></span><b>€${stakes[i].toFixed(2)}</b></div>`).join("");
   return `<div class="strat ${ti.k}">
     <div class="strat-h"><span class="sname">${ti.name}</span></div>
     <p class="sdesc">${ti.desc}</p>
     <div class="sdist">${dist}</div>
     <div class="srow big"><span>${t('sMaxWin')}</span><b class="pos">+€${maxP.toFixed(2)}</b></div>
     <div class="srow"><span>${t('sExp')}</span><b class="${expP>=0?'pos':'neg'}">${expP>=0?'+':''}€${expP.toFixed(2)}</b></div>

     <div class="srow"><span>${t('sAllWin')}</span><b>${(allW*100).toFixed(allW<0.1?1:0)}%</b></div>

/* ===== PAPER-TRADING LEDGER (fictional money, settles on real results) ===== */
const PKEY="wc_paper_v1";
function loadLedger(){try{return JSON.parse(localStorage.getItem(PKEY))||{};}catch(e){return{};}}
function saveLedger(l){try{localStorage.setItem(PKEY,JSON.stringify(l));}catch(e){}}
function actualSide(rH,rA){return rH>rA?"home":rH<rA?"away":"draw";}
// no-vig fair closing odds for the backed outcome (CLV benchmark = de-margined close)
function fairCloseOdds(co,side){const inv=1/co.coH+1/co.coD+1/co.coA;
 const raw=side==="home"?co.coH:side==="draw"?co.coD:co.coA;return raw*inv;} // 1/((1/raw)/inv)

function syncLedger(){
 const l=loadLedger();
 valueBets().forEach(r=>{const key=r.home+"|"+r.away;
  if(!l[key]){const f=FEED[key];const started=f&&f.status!=="SCHEDULED"&&f.status!=="TIMED";
   if(!started){l[key]={home:r.home,away:r.away,side:r.side,lbl:r.lbl,odd:r.odd,stake:+(BANKROLL*0.25*Math.max(0,r.kelly)).toFixed(2),status:"open"};}}});
 Object.values(l).forEach(b=>{if(b.status==="open"){const f=FEED[b.home+"|"+b.away];
  if(f&&f.status==="FINISHED"&&f.scoreH!=null&&f.scoreA!=null){
   b.status=b.side===actualSide(f.scoreH,f.scoreA)?"won":"lost";b.resH=f.scoreH;b.resA=f.scoreA;}}});
 // auto-fill CLV closing odds from the feed (de-vigged) if available and not manually set
 Object.values(l).forEach(b=>{if(b.clvCloseOdds==null){const f=FEED[b.home+"|"+b.away];
  if(f&&f.coH>0&&f.coD>0&&f.coA>0){b.clvCloseOdds=+fairCloseOdds(f,b.side).toFixed(3);b.clvAuto=true;}}});
 saveLedger(l);return l;
}
function clvOf(b){return b.clvCloseOdds>0?(b.odd/b.clvCloseOdds-1)*100:null;}
function renderPaper(){
 const l=syncLedger();const box=document.getElementById("paperBox");const kp=document.getElementById("paperKpis");
 const bets=Object.values(l);
 if(!bets.length){box.innerHTML=`<div class="noresult">${t('pNone')}</div>`;kp.innerHTML="";return;}

 const clvB=bets.filter(b=>b.clvCloseOdds>0),clvV=clvB.map(clvOf);
 const avgCLV=clvV.length?clvV.reduce((a,b)=>a+b,0)/clvV.length:null,clvPos=clvV.filter(v=>v>0).length;

  <div class="pk"><div class="pn">${t('pCLVpos')}</div><div class="pv">${clvB.length?clvPos+'/'+clvB.length:'—'}</div></div>`;
 const hint=`<p class="vintro" style="margin-bottom:14px">${t('clvHint')}</p>`;
 const skill=clvB.length?`<p class="vwarn">${t('skillNeed').replace('{n}',clvB.length)}</p>`:"";
 box.innerHTML=hint+`<div class="vscroll"><table class="vtab"><thead><tr><th>${t('pColMatch')}</th><th>${t('pColBet')}</th><th>${t('pColOdds')}</th><th>${t('colClose')}</th><th>${t('clv')}</th><th>${t('pColStake')}</th><th>${t('pColResult')}</th><th>${t('pColPL')}</th></tr></thead><tbody>`+

   const closeCell=b.clvCloseOdds>0?`${b.clvCloseOdds.toFixed(2)}`:`<input class="clv-input" data-key="${key}" type="number" step="0.01" min="1" placeholder="${t('closePh')}">`;
   const clvCell=clv==null?'—':`<span class="${clv>=0?'pos':'neg'}">${clv>=0?'+':''}${clv.toFixed(1)}%</span>`;

  `</tbody></table></div>`+skill+`<button class="btn" id="paperReset" style="margin-top:14px">${t('pReset')}</button>`;

/* ============ POISSON ============ */
function poisson(k,l){let p=Math.exp(-l);for(let i=1;i<=k;i++)p*=l/i;return p;}
function impliedProbs(oH,oD,oA){let h=1/oH,d=1/oD,a=1/oA,s=h+d+a;return[h/s,d/s,a/s];}
function fitLambdas(pH,pD,pA){let best=[1.3,1.0],err=1e9;
 for(let lh=0.20;lh<=3.2;lh+=0.05)for(let la=0.15;la<=3.0;la+=0.05){let H=0,D=0,A=0;
  for(let i=0;i<=8;i++){const pi=poisson(i,lh);for(let j=0;j<=8;j++){const p=pi*poisson(j,la);if(i>j)H+=p;else if(i===j)D+=p;else A+=p;}}
  const e=(H-pH)**2+(D-pD)**2+(A-pA)**2;if(e<err){err=e;best=[lh,la];}}return best;}
function topScore(lh,la){let b=[1,0],bp=0;for(let i=0;i<=7;i++){const pi=poisson(i,lh);for(let j=0;j<=7;j++){const p=pi*poisson(j,la);if(p>bp){bp=p;b=[i,j];}}}return{h:b[0],a:b[1],p:bp};}

/* ============ STATE ============ */
const state=[];
function buildState(){state.length=0;MATCHDAYS.forEach((md,mi)=>md.games.forEach(g=>{
 const[home,away,grp,date,oH,oD,oA]=g;const[pH,pD,pA]=impliedProbs(oH,oD,oA);const[lh,la]=fitLambdas(pH,pD,pA);
 state.push({mi,home,away,grp,date,pH,pD,pA,ts:topScore(lh,la)});}));}
function confDots(s){const m=Math.max(s.pH,s.pD,s.pA);return m>=.68?4:m>=.55?3:m>=.42?2:1;}
function nowTime(){return new Date().toLocaleTimeString(lang==="en"?"en-GB":lang,{hour:"2-digit",minute:"2-digit"});}
function animateNum(el,to){const v0=parseFloat(el.dataset.v||"0"),val=el.querySelector(".val")||el,t0=performance.now();
 (function s(t){const k=Math.min(1,(t-t0)/600),e=1-Math.pow(1-k,3),v=v0+(to-v0)*e;val.textContent=Math.round(v)+"%";if(k<1)requestAnimationFrame(s);else el.dataset.v=to;})(performance.now());}

/* ============ RENDER ============ */
let currentFilter="all",searchQuery="";
function matchesSearch(s){if(!searchQuery)return true;const q=searchQuery.toLowerCase();
 return s.home.toLowerCase().includes(q)||s.away.toLowerCase().includes(q)||("group "+s.grp).toLowerCase().includes(q)||s.grp.toLowerCase()===q;}
function visibleInDay(mi){return state.filter(s=>s.mi===mi&&matchesSearch(s));}
function render(){
 const grid=document.getElementById("grid");grid.innerHTML="";let conf=[],shown=0;
 MATCHDAYS.forEach((md,mi)=>{
  if(currentFilter!=="all"&&(+currentFilter)!==mi)return;
  const list=visibleInDay(mi);if(!list.length)return;
  const idx=["en","es","fr","pt","de","nl","tr","ar","ja","ko"].indexOf(lang);
  const h=document.createElement("div");h.className="md-head";
  h.innerHTML=`<span class="t">${md.label[idx<0?0:idx]}</span><span class="r"></span>`;grid.appendChild(h);
  list.forEach(s=>{
   shown++;conf.push(Math.max(s.pH,s.pD,s.pA));const dots=confDots(s);
   const c=document.createElement("div");c.className="card";c.style.setProperty("--tc",teamColor(s.home,s.away,s.pH,s.pA));
   c.innerHTML=`
    <span class="toprule"></span>
    <div class="m-top"><span class="grp">${t('group')} ${s.grp}</span>${liveBadge(s)||`<time>${s.date}</time>`}</div>
    <div class="fixture">
      <div class="side">${flag(s.home)}<span class="tname">${s.home}</span></div>
      <div class="predict"><span class="pl">${t('tip')}</span><span class="pscore"><span class="sh">${s.ts.h}</span><i>:</i><span class="sa">${s.ts.a}</span></span></div>
      <div class="side">${flag(s.away)}<span class="tname">${s.away}</span></div>
    </div>
    <div class="obar"><i class="b-home" style="width:${(s.pH*100).toFixed(1)}%"></i><i class="b-draw" style="width:${(s.pD*100).toFixed(1)}%"></i><i class="b-away" style="width:${(s.pA*100).toFixed(1)}%"></i></div>
    <div class="onums">
      <span class="h"><span class="num nH" data-v="0"><b class="val">0%</b></span><small>${t('home')}</small></span>
      <span class="d"><span class="num nD" data-v="0"><b class="val">0%</b></span><small>${t('draw')}</small></span>
      <span class="a"><span class="num nA" data-v="0"><b class="val">0%</b></span><small>${t('away')}</small></span>
    </div>
    <div class="m-foot"><span>${t('resultChance')} ~${(s.ts.p*100).toFixed(0)}%</span>
      <span class="conf">${t('confidence')} <span class="dots">${[1,2,3,4].map(d=>`<span class="dot ${d<=dots?'on':''}"></span>`).join("")}</span></span></div>`;
   grid.appendChild(c);
   requestAnimationFrame(()=>{animateNum(c.querySelector(".nH"),s.pH*100);animateNum(c.querySelector(".nD"),s.pD*100);animateNum(c.querySelector(".nA"),s.pA*100);});
  });
 });
 if(!shown){const n=document.createElement("div");n.className="noresult";n.textContent=t('noResult');grid.appendChild(n);}
 document.getElementById("kpi-matches").textContent=shown;
 document.getElementById("kpi-conf").textContent=(conf.length?Math.round(conf.reduce((a,b)=>a+b,0)/conf.length*100):0)+"%";
}

/* ============ LIVE DATA (real fetch, graceful fallback) ============ */
/* Set this to your deployed Cloudflare Worker URL to go live, e.g. "https://wm-2026-feed.<you>.workers.dev"
   Leave as "wm-data.json" to read a local file. */
const DATA_URL=(window.WM_FEED_URL)||"wm-data.json";
let feedConnected=false, FEED={};
function updateFeedStatus(){const el=document.getElementById("feedStatus");el.classList.toggle("live",feedConnected);
 el.querySelector(".ft").textContent=feedConnected?t('feedLive'):t('feedOff');}
async function tryFetchData(){
 try{const r=await fetch(DATA_URL,{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();
  FEED={};
  if(j&&Array.isArray(j.games)){j.games.forEach(g=>{
   for(const md of MATCHDAYS)for(const m of md.games){
    if(m[0]===g.home&&m[1]===g.away){if(g.oH)m[4]=+g.oH;if(g.oD)m[5]=+g.oD;if(g.oA)m[6]=+g.oA;}}
   FEED[g.home+"|"+g.away]={status:g.status,scoreH:g.scoreH,scoreA:g.scoreA,coH:g.coH,coD:g.coD,coA:g.coA};});}
  feedConnected=true;buildState();render();renderPaper();document.getElementById("kpi-updated").textContent=nowTime();
 }catch(e){feedConnected=false;}
 finally{updateFeedStatus();}
}
function liveBadge(s){const lv=FEED[s.home+"|"+s.away];
 if(!lv||lv.scoreH==null||lv.scoreA==null)return"";
 const fin=lv.status==="FINISHED";
 return `<span class="livebox ${fin?'fin':'on'}">${fin?'FT':'<span class="ld"></span> LIVE'} ${lv.scoreH}–${lv.scoreA}</span>`;}
